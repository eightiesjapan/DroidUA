plugins { id 'com.android.application' }
android {
    namespace 'org.openua.android'
    buildFeatures { buildConfig true }
    compileSdk 35
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'
    signingConfigs { debug { storeFile rootProject.file('../../Android/debug.keystore') } }
    defaultConfig {
        applicationId 'org.openua.android.beta'
        minSdk 24
        targetSdk 34
        // DroidUA 0.6 beta installs beside the main DroidUA app (own ID, data and saves).
        versionCode 16
        versionName '0.8.2-beta'
        resValue 'string', 'app_label', 'DroidUA beta'
        testInstrumentationRunner 'org.openua.android.DroidUAIntegrationTest'
        ndk { abiFilters 'arm64-v8a' }
        // Native code is always built optimised (-O2 -g, NDEBUG), even in this
        // debuggable APK: engine, gl4es, SDL, OpenAL and Vorbis were previously
        // compiled at -O0. -g keeps symbols in the unstripped crash-analysis copies.
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5',
            '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt'; version '4.1.2' } }
}
